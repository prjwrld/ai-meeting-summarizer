<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Meeting Summarizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .container {
            margin-top: 60px;
            max-width: 800px;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .header {
            font-weight: bold;
            font-size: 2rem;
        }

        .btn-primary {
            border-radius: 30px;
        }

        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        footer {
            margin-top: 60px;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="header">🎙️ AI Meeting Summarizer</h1>
            <p class="text-muted">Upload a WAV file. We’ll transcribe and summarize it for you using AI!</p>
        </div>

        <div class="card p-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <input class="form-control" type="file" name="audio" accept=".wav" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Transcribe & Summarize</button>
            </form>
        </div>

        {% if transcript %}
        <div class="card mt-4 p-3">
            <h5 class="text-success">📝 Transcription</h5>
            <pre>{{ transcript }}</pre>
        </div>
        {% endif %}

        {% if summary %}
        <div class="card mt-4 p-3">
            <h5 class="text-info">📄 Summary</h5>
            <pre>{{ summary }}</pre>
        </div>
        {% endif %}

        <footer class="text-center">
            Built with ❤️ by Praju – Powered by Azure & Hugging Face
        </footer>
    </div>
</body>
</html>
